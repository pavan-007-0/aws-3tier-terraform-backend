stages:
  - validate
  - bootstrap
  - infra
  - build
  - deploy

variables:
  AWS_DEFAULT_REGION: "us-east-1"
  TF_VERSION: "1.9.8"
  TF_DIR: "."
  ECR_REPO: "backend-repo"
  IMAGE_TAG: "latest"

validate-terraform:
  stage: validate
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  script:
    - cd "$TF_DIR"
    - terraform fmt -check -recursive -diff

validate-aws-credentials:
  stage: validate
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  script:
    - aws sts get-caller-identity

validate-dockerfile:
  stage: validate
  image: hadolint/hadolint:latest-alpine
  script:
    - hadolint Dockerfile || true

validate-python-code:
  stage: validate
  image: python:3.11-alpine
  script:
    - pip install --quiet flake8
    - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

bootstrap-state-bucket:
  stage: bootstrap
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  script:
    - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - STATE_BUCKET="tf-state-${AWS_ACCOUNT_ID}-${AWS_DEFAULT_REGION}"
    - echo "Ensuring S3 state bucket $STATE_BUCKET exists"
    - |
      if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
        echo "Bucket $STATE_BUCKET already exists - skipping"
      else
        if [ "$AWS_DEFAULT_REGION" = "us-east-1" ]; then
          aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_DEFAULT_REGION"
        else
          aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_DEFAULT_REGION" --create-bucket-configuration LocationConstraint="$AWS_DEFAULT_REGION"
        fi
        aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
        aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
        echo "Bucket $STATE_BUCKET created"
      fi

infra-apply:
  stage: infra
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  script:
    - yum install -y unzip >/dev/null
    - curl -sSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/tf.zip
    - unzip -o /tmp/tf.zip -d /usr/local/bin
    - terraform version
    - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - if [ -z "$AWS_ACCOUNT_ID" ]; then echo "ERROR failed to get AWS account ID"; exit 1; fi
    - export AWS_ACCOUNT_ID
    - export STATE_BUCKET="tf-state-${AWS_ACCOUNT_ID}-${AWS_DEFAULT_REGION}"
    - echo "AWS account $AWS_ACCOUNT_ID state bucket $STATE_BUCKET"
    - cd "$TF_DIR"
    - terraform init -backend-config="bucket=$STATE_BUCKET"
    - terraform apply -auto-approve -target=aws_eks_cluster.this -target=aws_eks_node_group.backend -target=aws_eks_addon.vpc_cni -target=aws_eks_addon.coredns -target=aws_eks_addon.kube_proxy -target=helm_release.alb_controller -target=helm_release.eso -target=kubernetes_service_account.eso
    - terraform apply -auto-approve
  artifacts:
    paths:
      - .terraform.lock.hcl
    expire_in: 1 day

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - apk add --no-cache aws-cli
  script:
    - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - export ECR_URL="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}"
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
    - docker build -t "${ECR_URL}:${IMAGE_TAG}" .
    - docker push "${ECR_URL}:${IMAGE_TAG}"

deploy:
  stage: deploy
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  before_script:
    - yum install -y tar gzip >/dev/null
  script:
    - curl -sLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl"
    - chmod +x /usr/local/bin/kubectl
    - aws eks update-kubeconfig --region "$AWS_DEFAULT_REGION" --name ecommerce-cluster
    - kubectl rollout restart deployment/backend -n default
    - kubectl rollout status deployment/backend -n default --timeout=300s
    - echo "Backend deployed. ALB DNS:"
    - kubectl get ingress backend -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' || true
    - echo ""