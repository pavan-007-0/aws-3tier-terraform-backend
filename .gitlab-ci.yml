stages:
  - validate
  - bootstrap
  - infra
  - build
  - deploy

variables:
  AWS_DEFAULT_REGION: "us-east-1"
  TF_VERSION: "1.9.8"
  TF_DIR: "."
  ECR_REPO: "backend-repo"
  CLUSTER_NAME: "ecommerce-cluster"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Quiet warnings; collapse plan/apply output
  TF_CLI_ARGS: "-no-color"

# ---------------------------------------------------------------------
# Validation
# ---------------------------------------------------------------------
validate-terraform:
  stage: validate
  image: { name: "hashicorp/terraform:1.9", entrypoint: [""] }
  script:
    - cd "$TF_DIR"
    - terraform fmt -check -recursive -diff

validate-aws-credentials:
  stage: validate
  image: { name: "amazon/aws-cli", entrypoint: [""] }
  script:
    - aws sts get-caller-identity

# ---------------------------------------------------------------------
# Bootstrap S3 state bucket (idempotent)
# ---------------------------------------------------------------------
bootstrap-state-bucket:
  stage: bootstrap
  image: { name: "amazon/aws-cli", entrypoint: [""] }
  script:
    - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - STATE_BUCKET="tf-state-${AWS_ACCOUNT_ID}-${AWS_DEFAULT_REGION}"
    - |
      if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
        echo "State bucket $STATE_BUCKET exists"
      else
        if [ "$AWS_DEFAULT_REGION" = "us-east-1" ]; then
          aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_DEFAULT_REGION"
        else
          aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_DEFAULT_REGION" \
            --create-bucket-configuration LocationConstraint="$AWS_DEFAULT_REGION"
        fi
        aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" \
          --versioning-configuration Status=Enabled
        aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" \
          --server-side-encryption-configuration \
          '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
        echo "Created state bucket $STATE_BUCKET"
      fi

# ---------------------------------------------------------------------
# Infrastructure (Terraform) - fully idempotent, single apply
# ---------------------------------------------------------------------
infra-apply:
  stage: infra
  image: { name: "amazon/aws-cli", entrypoint: [""] }
  before_script:
    - dnf install -y unzip tar gzip jq >/dev/null
    - curl -sSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/tf.zip
    - unzip -o /tmp/tf.zip -d /usr/local/bin >/dev/null
    - terraform version
  script:
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - export STATE_BUCKET="tf-state-${AWS_ACCOUNT_ID}-${AWS_DEFAULT_REGION}"
    - cd "$TF_DIR"

    # ---- 0. Ensure ALB controller IAM policy JSON file is present
    - mkdir -p policies
    - |
      if [ ! -s policies/alb-controller-policy.json ]; then
        echo "Downloading canonical ALB controller IAM policy"
        curl -fsSL \
          https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/v2.7.2/docs/install/iam_policy.json \
          -o policies/alb-controller-policy.json
      fi

    # ---- 1. Initialize backend
    - terraform init -reconfigure -backend-config="bucket=$STATE_BUCKET"

    # ---- 2. Import any AWS resources that exist but aren't in state
    #         (handles state-loss + AWS-orphans scenarios)
    - |
      import_if_orphan() {
        local addr="$1"; local exists_cmd="$2"; local import_id="$3"
        if terraform state show "$addr" >/dev/null 2>&1; then
          return 0
        fi
        if eval "$exists_cmd" >/dev/null 2>&1; then
          echo "==> Importing orphan: $addr -> $import_id"
          terraform import -input=false "$addr" "$import_id" || true
        fi
      }

      # IAM policies
      ALB_POLICY_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:policy/AWSLoadBalancerControllerIAMPolicy"
      ESO_POLICY_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:policy/ExternalSecretsPolicy"
      import_if_orphan "aws_iam_policy.alb_controller" \
        "aws iam get-policy --policy-arn $ALB_POLICY_ARN" "$ALB_POLICY_ARN"
      import_if_orphan "aws_iam_policy.eso" \
        "aws iam get-policy --policy-arn $ESO_POLICY_ARN" "$ESO_POLICY_ARN"

      # IAM roles
      import_if_orphan "aws_iam_role.eks_cluster" \
        "aws iam get-role --role-name ${CLUSTER_NAME}-cluster-role" \
        "${CLUSTER_NAME}-cluster-role"
      import_if_orphan "aws_iam_role.node" \
        "aws iam get-role --role-name ${CLUSTER_NAME}-node-role" \
        "${CLUSTER_NAME}-node-role"
      import_if_orphan "aws_iam_role.alb_controller" \
        "aws iam get-role --role-name AWSLoadBalancerControllerRole" \
        "AWSLoadBalancerControllerRole"
      import_if_orphan "aws_iam_role.eso" \
        "aws iam get-role --role-name ExternalSecretsRole" \
        "ExternalSecretsRole"

      # IAM role policy attachments
      import_if_orphan "aws_iam_role_policy_attachment.eks_cluster_policy" \
        "aws iam list-attached-role-policies --role-name ${CLUSTER_NAME}-cluster-role --query 'AttachedPolicies[?PolicyArn==\`arn:aws:iam::aws:policy/AmazonEKSClusterPolicy\`]' --output text | grep -q AmazonEKSClusterPolicy" \
        "${CLUSTER_NAME}-cluster-role/arn:aws:iam::aws:policy/AmazonEKSClusterPolicy"
      import_if_orphan "aws_iam_role_policy_attachment.node_worker" \
        "aws iam list-attached-role-policies --role-name ${CLUSTER_NAME}-node-role --query 'AttachedPolicies[?PolicyArn==\`arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy\`]' --output text | grep -q AmazonEKSWorkerNodePolicy" \
        "${CLUSTER_NAME}-node-role/arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy"
      import_if_orphan "aws_iam_role_policy_attachment.node_cni" \
        "aws iam list-attached-role-policies --role-name ${CLUSTER_NAME}-node-role --query 'AttachedPolicies[?PolicyArn==\`arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy\`]' --output text | grep -q AmazonEKS_CNI_Policy" \
        "${CLUSTER_NAME}-node-role/arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy"
      import_if_orphan "aws_iam_role_policy_attachment.node_ecr" \
        "aws iam list-attached-role-policies --role-name ${CLUSTER_NAME}-node-role --query 'AttachedPolicies[?PolicyArn==\`arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly\`]' --output text | grep -q ContainerRegistry" \
        "${CLUSTER_NAME}-node-role/arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly"
      import_if_orphan "aws_iam_role_policy_attachment.node_elb" \
        "aws iam list-attached-role-policies --role-name ${CLUSTER_NAME}-node-role --query 'AttachedPolicies[?PolicyArn==\`arn:aws:iam::aws:policy/ElasticLoadBalancingFullAccess\`]' --output text | grep -q ElasticLoadBalancing" \
        "${CLUSTER_NAME}-node-role/arn:aws:iam::aws:policy/ElasticLoadBalancingFullAccess"
      import_if_orphan "aws_iam_role_policy_attachment.alb_controller" \
        "aws iam list-attached-role-policies --role-name AWSLoadBalancerControllerRole --query 'AttachedPolicies[?PolicyArn==\`'$ALB_POLICY_ARN'\`]' --output text | grep -q LoadBalancer" \
        "AWSLoadBalancerControllerRole/$ALB_POLICY_ARN"
      import_if_orphan "aws_iam_role_policy_attachment.eso" \
        "aws iam list-attached-role-policies --role-name ExternalSecretsRole --query 'AttachedPolicies[?PolicyArn==\`'$ESO_POLICY_ARN'\`]' --output text | grep -q ExternalSecrets" \
        "ExternalSecretsRole/$ESO_POLICY_ARN"

      # ECR repository
      import_if_orphan "aws_ecr_repository.backend" \
        "aws ecr describe-repositories --repository-names ${ECR_REPO} --region ${AWS_DEFAULT_REGION}" \
        "${ECR_REPO}"

      # OIDC provider (only if cluster exists)
      OIDC_URL=$(aws eks describe-cluster --name ${CLUSTER_NAME} --region ${AWS_DEFAULT_REGION} \
        --query 'cluster.identity.oidc.issuer' --output text 2>/dev/null | sed 's|https://||' || echo "")
      if [ -n "$OIDC_URL" ] && [ "$OIDC_URL" != "None" ]; then
        OIDC_ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:oidc-provider/${OIDC_URL}"
        import_if_orphan "aws_iam_openid_connect_provider.this" \
          "aws iam get-open-id-connect-provider --open-id-connect-provider-arn $OIDC_ARN" \
          "$OIDC_ARN"
      fi

      # EKS cluster
      import_if_orphan "aws_eks_cluster.this" \
        "aws eks describe-cluster --name ${CLUSTER_NAME} --region ${AWS_DEFAULT_REGION}" \
        "${CLUSTER_NAME}"

      # EKS node group
      import_if_orphan "aws_eks_node_group.backend" \
        "aws eks describe-nodegroup --cluster-name ${CLUSTER_NAME} --nodegroup-name backend-nodes --region ${AWS_DEFAULT_REGION}" \
        "${CLUSTER_NAME}:backend-nodes"

      # EKS addons
      for addon in vpc_cni:vpc-cni coredns:coredns kube_proxy:kube-proxy; do
        tf_name="${addon%%:*}"; addon_name="${addon##*:}"
        import_if_orphan "aws_eks_addon.${tf_name}" \
          "aws eks describe-addon --cluster-name ${CLUSTER_NAME} --addon-name ${addon_name} --region ${AWS_DEFAULT_REGION}" \
          "${CLUSTER_NAME}:${addon_name}"
      done

      # RDS security group
      SG_ID=$(aws ec2 describe-security-groups \
        --filters "Name=group-name,Values=ecommerce-rds-sg" \
        --query "SecurityGroups[0].GroupId" --output text 2>/dev/null || echo "None")
      if [ "$SG_ID" != "None" ] && [ -n "$SG_ID" ]; then
        import_if_orphan "aws_security_group.rds" "true" "$SG_ID"
      fi

    # ---- 3. Refresh state to drop entries for resources deleted in AWS
    - terraform apply -refresh-only -auto-approve -compact-warnings || true

    # ---- 4. Single apply (no -target, no warnings)
    - terraform apply -auto-approve -compact-warnings -var "image_tag=${IMAGE_TAG}"

  artifacts:
    paths:
      - .terraform.lock.hcl
      - policies/
    expire_in: 1 day

# ---------------------------------------------------------------------
# Build & push image
# ---------------------------------------------------------------------
build:
  stage: build
  image: { name: "amazon/aws-cli", entrypoint: [""] }
  services:
    - docker:24-dind
  before_script:
    - dnf install -y docker >/dev/null
  script:
    - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - export ECR_URL="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}"
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
        | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
    - docker build -t "${ECR_URL}:${IMAGE_TAG}" -t "${ECR_URL}:latest" .
    - docker push "${ECR_URL}:${IMAGE_TAG}"
    - docker push "${ECR_URL}:latest"

# ---------------------------------------------------------------------
# Deploy (rolls pods to the new image tag)
# ---------------------------------------------------------------------
deploy:
  stage: deploy
  image: { name: "amazon/aws-cli", entrypoint: [""] }
  before_script:
    - curl -sLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl"
    - chmod +x /usr/local/bin/kubectl
  script:
    - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - ECR_URL="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}"
    - aws eks update-kubeconfig --region "$AWS_DEFAULT_REGION" --name "$CLUSTER_NAME"
    - kubectl set image deployment/backend backend="${ECR_URL}:${IMAGE_TAG}" -n default
    - kubectl rollout status deployment/backend -n default --timeout=300s
    - echo "Backend deployed. ALB DNS:"
    - kubectl get ingress backend -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' || true
    - echo ""
