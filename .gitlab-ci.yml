stages:
  - validate
  - bootstrap
  - infra
  - build
  - deploy

variables:
  AWS_DEFAULT_REGION: us-east-1
  BACKEND_REPO: backend-repo
  IMAGE_TAG: latest
  CLUSTER_NAME: ecommerce-cluster
  TF_DIR: .
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"

# Resolve AWS account + state bucket name. Fail fast if creds are broken.
.aws_env: &aws_env
  - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
  - 'if [ -z "$AWS_ACCOUNT_ID" ]; then echo "ERROR: failed to get AWS account ID"; exit 1; fi'
  - export AWS_ACCOUNT_ID
  - export STATE_BUCKET="tf-state-${AWS_ACCOUNT_ID}-${AWS_DEFAULT_REGION}"
  - echo "AWS account $AWS_ACCOUNT_ID  /  state bucket $STATE_BUCKET"

# Install Terraform into amazon/aws-cli (glibc) image.
.install_terraform: &install_terraform
  - yum install -y unzip >/dev/null
  - curl -sSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/tf.zip
  - unzip -o /tmp/tf.zip -d /usr/local/bin
  - terraform version

# ==========================
# STAGE 1 - VALIDATE
# ==========================
validate-aws-credentials:
  stage: validate
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  script:
    - aws sts get-caller-identity
    - aws ec2 describe-availability-zones --region "$AWS_DEFAULT_REGION" --query "AvailabilityZones[0].State" --output text
    - echo "AWS credentials OK"
  only:
    - main

validate-python-code:
  stage: validate
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  before_script:
    - yum install -y python3-pip
    - pip3 install pyflakes bandit flask flask-cors flask-limiter flask-wtf mysql-connector-python python-dotenv PyJWT Werkzeug cryptography bcrypt marshmallow email-validator requests gunicorn
  script:
    - |
      SYNTAX_ERRORS=0
      for f in $(find . -name "*.py" -not -path "./__pycache__/*"); do
        python3 -m py_compile "$f" 2>&1 || SYNTAX_ERRORS=$((SYNTAX_ERRORS + 1))
      done
      if [ $SYNTAX_ERRORS -gt 0 ]; then echo "Syntax errors found"; exit 1; fi
    - python3 -m pyflakes app.py auth.py db.py orders.py products.py cart.py admin.py security.py error_handlers.py 2>&1 || true
    - python3 -m bandit -r app.py auth.py db.py orders.py products.py cart.py admin.py security.py error_handlers.py --severity-level high -f txt 2>&1 || true
  only:
    - main

validate-dockerfile:
  stage: validate
  image: alpine:3.21
  script:
    - 'test -f Dockerfile || { echo "ERROR: Dockerfile not found"; exit 1; }'
    - 'grep -qE "^FROM " Dockerfile || { echo "ERROR: FROM missing"; exit 1; }'
    - 'grep -qE "^(COPY|ADD) " Dockerfile || { echo "ERROR: COPY/ADD missing"; exit 1; }'
    - 'grep -qE "^(CMD|ENTRYPOINT) " Dockerfile || { echo "ERROR: CMD/ENTRYPOINT missing"; exit 1; }'
    - 'test -s requirements.txt || { echo "ERROR: requirements.txt missing/empty"; exit 1; }'
  only:
    - main

validate-terraform:
  stage: validate
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  script:
    - cd "$TF_DIR"
    - terraform fmt -check -recursive -diff
    - terraform init -backend=false
    - terraform validate
  only:
    - main

# ==========================
# STAGE 2 - BOOTSTRAP
# Idempotent S3 state bucket creation.
# ==========================
bootstrap-state-bucket:
  stage: bootstrap
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  needs: ["validate-aws-credentials", "validate-terraform"]
  before_script:
    - *aws_env
  script:
    - |
      if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
        echo "State bucket already exists: $STATE_BUCKET"
      else
        echo "Creating state bucket: $STATE_BUCKET"
        if [ "$AWS_DEFAULT_REGION" = "us-east-1" ]; then
          aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_DEFAULT_REGION"
        else
          aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_DEFAULT_REGION" \
            --create-bucket-configuration LocationConstraint="$AWS_DEFAULT_REGION"
        fi
        aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" \
          --versioning-configuration Status=Enabled
        aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" \
          --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
        aws s3api put-public-access-block --bucket "$STATE_BUCKET" \
          --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
        echo "State bucket ready"
      fi
  only:
    - main

# ==========================
# STAGE 3 - INFRA (Terraform)
# Two-stage apply: kubernetes_manifest needs the API server alive at PLAN time,
# so we create EKS + Helm releases first, then run a full apply.
# ==========================
infra-apply:
  stage: infra
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  needs: ["bootstrap-state-bucket"]
  before_script:
    - *install_terraform
    - *aws_env
  script:
    - cd "$TF_DIR"
    - terraform init -backend-config="bucket=$STATE_BUCKET"
    # Stage 1: stand up cluster, addons, controllers, ESO
    - |
      terraform apply -auto-approve \
        -target=aws_eks_cluster.this \
        -target=aws_eks_node_group.backend \
        -target=aws_eks_addon.vpc_cni \
        -target=aws_eks_addon.coredns \
        -target=aws_eks_addon.kube_proxy \
        -target=kubernetes_service_account.alb_controller \
        -target=helm_release.alb_controller \
        -target=kubernetes_namespace.eso \
        -target=helm_release.eso \
        -target=kubernetes_service_account.eso
    # Stage 2: full apply (kubernetes_manifest can now reach the API)
    - terraform apply -auto-approve
    - terraform output -json > tf-outputs.json
  artifacts:
    paths:
      - $TF_DIR/tf-outputs.json
    expire_in: 1 day
  timeout: 60m
  only:
    - main

# ==========================
# STAGE 4 - BUILD
# Build backend image and push to ECR.
# ==========================
build-backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs: ["infra-apply", "validate-python-code", "validate-dockerfile"]
  before_script:
    - apk add --no-cache aws-cli
    - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - 'if [ -z "$AWS_ACCOUNT_ID" ]; then echo "ERROR: failed to get AWS account ID"; exit 1; fi'
    - export AWS_ACCOUNT_ID
  script:
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - docker build -t "$BACKEND_REPO:$IMAGE_TAG" .
    - docker tag "$BACKEND_REPO:$IMAGE_TAG" "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
    - docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
  only:
    - main

# ==========================
# STAGE 5 - DEPLOY
# Re-apply to roll out the new image.
# ==========================
deploy-backend:
  stage: deploy
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  needs: ["build-backend"]
  before_script:
    - *install_terraform
    - *aws_env
  script:
    - cd "$TF_DIR"
    - terraform init -backend-config="bucket=$STATE_BUCKET"
    - terraform apply -auto-approve -replace=kubernetes_deployment_v1.backend
    - echo "Backend ALB hostname:"
    - terraform output -raw backend_alb_hostname || true
  only:
    - main