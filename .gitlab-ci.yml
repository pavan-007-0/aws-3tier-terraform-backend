stages:

* deploy

deploy-all:
stage: deploy
image: amazon/aws-cli
services:
- docker:24-dind

variables:
AWS_DEFAULT_REGION: "us-east-1"
TF_VERSION: "1.9.8"
ECR_REPO: "backend-repo"
CLUSTER_NAME: "ecommerce-cluster"
IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
DOCKER_HOST: "tcp://docker:2375"
DOCKER_TLS_CERTDIR: ""

before_script:
- yum install -y unzip curl tar gzip docker

```
# Install Terraform
- curl -sSL https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip -o tf.zip
- unzip tf.zip
- mv terraform /usr/local/bin/
- terraform version
```

script:
# -------------------------
# AWS Identity
# -------------------------
- AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
- STATE_BUCKET="tf-state-${AWS_ACCOUNT_ID}-${AWS_DEFAULT_REGION}"

```
# -------------------------
# Bootstrap S3 (auto create)
# -------------------------
- |
  if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
    echo "S3 bucket exists"
  else
    echo "Creating S3 bucket..."
    aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_DEFAULT_REGION"
  fi

# -------------------------
# Terraform Init + Apply
# -------------------------
- terraform init -reconfigure \
    -backend-config="bucket=$STATE_BUCKET" \
    -backend-config="key=ecommerce/terraform.tfstate" \
    -backend-config="region=$AWS_DEFAULT_REGION"

- terraform apply -auto-approve -var="image_tag=${IMAGE_TAG}"

# -------------------------
# Build & Push Docker
# -------------------------
- ECR_URL="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}"

- aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
    | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

- docker build -t "${ECR_URL}:${IMAGE_TAG}" -t "${ECR_URL}:latest" .
- docker push "${ECR_URL}:${IMAGE_TAG}"
- docker push "${ECR_URL}:latest"

# -------------------------
# Deploy to EKS
# -------------------------
- curl -sLo kubectl https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl
- chmod +x kubectl
- mv kubectl /usr/local/bin/

- aws eks update-kubeconfig --region "$AWS_DEFAULT_REGION" --name "$CLUSTER_NAME"

- kubectl set image deployment/backend backend="${ECR_URL}:${IMAGE_TAG}" -n default || true
- kubectl rollout status deployment/backend -n default --timeout=300s || true

- echo "Deployment completed successfully"
```
