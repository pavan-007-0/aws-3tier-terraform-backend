stages:
  - validate
  - bootstrap
  - infra
  - build
  - deploy

variables:
  AWS_DEFAULT_REGION: "us-east-1"
  TF_VERSION: "1.9.8"
  TF_DIR: "."
  ECR_REPO: "backend-repo"
  CLUSTER_NAME: "ecommerce-cluster"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_CLI_ARGS: "-no-color"

# ---------------------------------------------------------------------
# Validation
# ---------------------------------------------------------------------
validate-terraform:
  stage: validate
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  script:
    - cd "$TF_DIR"
    - terraform fmt -check -recursive -diff

validate-aws-credentials:
  stage: validate
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  script:
    - aws sts get-caller-identity

# ---------------------------------------------------------------------
# Bootstrap S3 state bucket (idempotent)
# ---------------------------------------------------------------------
bootstrap-state-bucket:
  stage: bootstrap
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  script:
    - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - STATE_BUCKET="tf-state-${AWS_ACCOUNT_ID}-${AWS_DEFAULT_REGION}"
    - |
      if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
        echo "State bucket $STATE_BUCKET exists"
      else
        if [ "$AWS_DEFAULT_REGION" = "us-east-1" ]; then
          aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_DEFAULT_REGION"
        else
          aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_DEFAULT_REGION" \
            --create-bucket-configuration LocationConstraint="$AWS_DEFAULT_REGION"
        fi
        aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" \
          --versioning-configuration Status=Enabled
        aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" \
          --server-side-encryption-configuration \
          '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
        echo "Created state bucket $STATE_BUCKET"
      fi

# ---------------------------------------------------------------------
# Infrastructure (Terraform) - fully idempotent
# ---------------------------------------------------------------------
infra-apply:
  stage: infra
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  before_script:
    - dnf install -y unzip tar gzip jq >/dev/null
    - curl -sSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/tf.zip
    - unzip -o /tmp/tf.zip -d /usr/local/bin >/dev/null
    - terraform version
  script:
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - export STATE_BUCKET="tf-state-${AWS_ACCOUNT_ID}-${AWS_DEFAULT_REGION}"
    - cd "$TF_DIR"

    # ---- 0. Ensure ALB controller IAM policy JSON is present
    - mkdir -p policies
    - |
      if [ ! -s policies/alb-controller-policy.json ]; then
        echo "Downloading canonical ALB controller IAM policy"
        curl -fsSL \
          https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/v2.7.2/docs/install/iam_policy.json \
          -o policies/alb-controller-policy.json
      fi

    # ---- 1. PRE-CLEAN: delete any orphan IAM/OIDC resources from AWS
    #         that exist but are not in current Terraform state.
    #         This guarantees a clean slate even after partial deletes.
    - terraform init -reconfigure -backend-config="bucket=$STATE_BUCKET"
    - |
      echo "===== Pre-cleaning orphan IAM resources ====="

      tf_has() {
        terraform state show "$1" >/dev/null 2>&1
      }

      # IAM ROLES: detach all policies, then delete (only if not in TF state)
      for ENTRY in \
          "aws_iam_role.eks_cluster:${CLUSTER_NAME}-cluster-role" \
          "aws_iam_role.node:${CLUSTER_NAME}-node-role" \
          "aws_iam_role.alb_controller:AWSLoadBalancerControllerRole" \
          "aws_iam_role.eso:ExternalSecretsRole"; do
        ADDR="${ENTRY%%:*}"
        ROLE="${ENTRY##*:}"
        if tf_has "$ADDR"; then
          echo "  [keep]   role $ROLE (in TF state)"
          continue
        fi
        if aws iam get-role --role-name "$ROLE" >/dev/null 2>&1; then
          echo "  [delete] orphan role $ROLE"
          for P in $(aws iam list-attached-role-policies --role-name "$ROLE" \
                       --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null); do
            aws iam detach-role-policy --role-name "$ROLE" --policy-arn "$P" 2>/dev/null || true
          done
          for IP in $(aws iam list-role-policies --role-name "$ROLE" \
                        --query 'PolicyNames[]' --output text 2>/dev/null); do
            aws iam delete-role-policy --role-name "$ROLE" --policy-name "$IP" 2>/dev/null || true
          done
          for IP in $(aws iam list-instance-profiles-for-role --role-name "$ROLE" \
                        --query 'InstanceProfiles[].InstanceProfileName' --output text 2>/dev/null); do
            aws iam remove-role-from-instance-profile --instance-profile-name "$IP" --role-name "$ROLE" 2>/dev/null || true
          done
          aws iam delete-role --role-name "$ROLE" 2>/dev/null || true
        fi
      done

      # IAM POLICIES: delete non-default versions, then the policy
      for ENTRY in \
          "aws_iam_policy.alb_controller:AWSLoadBalancerControllerIAMPolicy" \
          "aws_iam_policy.eso:ExternalSecretsPolicy"; do
        ADDR="${ENTRY%%:*}"
        POL="${ENTRY##*:}"
        ARN="arn:aws:iam::${AWS_ACCOUNT_ID}:policy/${POL}"
        if tf_has "$ADDR"; then
          echo "  [keep]   policy $POL (in TF state)"
          continue
        fi
        if aws iam get-policy --policy-arn "$ARN" >/dev/null 2>&1; then
          echo "  [delete] orphan policy $POL"
          for ROLE_USING in $(aws iam list-entities-for-policy --policy-arn "$ARN" \
                               --query 'PolicyRoles[].RoleName' --output text 2>/dev/null); do
            aws iam detach-role-policy --role-name "$ROLE_USING" --policy-arn "$ARN" 2>/dev/null || true
          done
          for V in $(aws iam list-policy-versions --policy-arn "$ARN" \
                       --query 'Versions[?!IsDefaultVersion].VersionId' --output text 2>/dev/null); do
            aws iam delete-policy-version --policy-arn "$ARN" --version-id "$V" 2>/dev/null || true
          done
          aws iam delete-policy --policy-arn "$ARN" 2>/dev/null || true
        fi
      done

      # OIDC PROVIDER: delete any that aren't tracked in TF state
      if ! tf_has "aws_iam_openid_connect_provider.this"; then
        for OIDC_ARN in $(aws iam list-open-id-connect-providers \
                            --query 'OpenIDConnectProviderList[].Arn' --output text 2>/dev/null); do
          # only delete EKS OIDC providers (oidc.eks.<region>.amazonaws.com)
          if echo "$OIDC_ARN" | grep -q "oidc.eks.${AWS_DEFAULT_REGION}.amazonaws.com"; then
            echo "  [delete] orphan OIDC provider $OIDC_ARN"
            aws iam delete-open-id-connect-provider --open-id-connect-provider-arn "$OIDC_ARN" 2>/dev/null || true
          fi
        done
      fi

      # ECR REPO: delete if orphan (no images preserved -- build job repushes)
      if ! tf_has "aws_ecr_repository.backend"; then
        if aws ecr describe-repositories --repository-names "$ECR_REPO" \
             --region "$AWS_DEFAULT_REGION" >/dev/null 2>&1; then
          echo "  [delete] orphan ECR repo $ECR_REPO"
          aws ecr delete-repository --repository-name "$ECR_REPO" \
            --region "$AWS_DEFAULT_REGION" --force >/dev/null 2>&1 || true
        fi
      fi

      # RDS SECURITY GROUP: delete if orphan
      if ! tf_has "aws_security_group.rds"; then
        SG_ID=$(aws ec2 describe-security-groups \
                  --filters "Name=group-name,Values=ecommerce-rds-sg" \
                  --query "SecurityGroups[0].GroupId" --output text 2>/dev/null || echo "None")
        if [ "$SG_ID" != "None" ] && [ -n "$SG_ID" ]; then
          echo "  [delete] orphan RDS SG $SG_ID"
          aws ec2 delete-security-group --group-id "$SG_ID" 2>/dev/null || true
        fi
      fi

      echo "===== Pre-clean complete ====="

    # ---- 2. Refresh state to drop entries for resources deleted in AWS
    - terraform apply -refresh-only -auto-approve -compact-warnings || true

    # ---- 3. Single apply (no -target, no warnings)
    - terraform apply -auto-approve -compact-warnings -var "image_tag=${IMAGE_TAG}"

  artifacts:
    paths:
      - .terraform.lock.hcl
      - policies/
    expire_in: 1 day

# ---------------------------------------------------------------------
# Build & push image
# ---------------------------------------------------------------------
build:
  stage: build
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  services:
    - docker:24-dind
  before_script:
    - dnf install -y docker >/dev/null
  script:
    - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - export ECR_URL="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}"
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
        | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
    - docker build -t "${ECR_URL}:${IMAGE_TAG}" -t "${ECR_URL}:latest" .
    - docker push "${ECR_URL}:${IMAGE_TAG}"
    - docker push "${ECR_URL}:latest"

# ---------------------------------------------------------------------
# Deploy (rolls pods to the new image tag)
# ---------------------------------------------------------------------
deploy:
  stage: deploy
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  before_script:
    - curl -sLo /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.32.0/bin/linux/amd64/kubectl"
    - chmod +x /usr/local/bin/kubectl
  script:
    - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - ECR_URL="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO}"
    - aws eks update-kubeconfig --region "$AWS_DEFAULT_REGION" --name "$CLUSTER_NAME"
    - kubectl set image deployment/backend backend="${ECR_URL}:${IMAGE_TAG}" -n default
    - kubectl rollout status deployment/backend -n default --timeout=300s
    - echo "Backend deployed. ALB DNS:"
    - kubectl get ingress backend -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' || true
    - echo ""
